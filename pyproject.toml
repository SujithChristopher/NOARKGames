[project]
name = "noarkgames"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"opencv-contrib-python>=4.13.0.92",
	"scipy>=1.17.1",
	"toml>=0.10.2",
	"bless>=0.3.0",
	"bleak>=3.0.1",
	"simplepyble>=0.12.1",
	"rcam",
	"maturin>=1.14.1",
	"locus-tag>=0.6.0",
	"rapidtag>=0.1.10",
	"msgpack>=1.0",
	"msgpack-numpy>=0.4.8",
	# Optional at runtime (frame_recorder degrades to a zero sync column without
	# it), but declared so `uv sync` stops pruning it.
	"gpiod>=2.5",
	"onnxruntime-qnn>=2.4.0",
]

[tool.uv.sources]
rcam = { path = "external/rcam", editable = true }
rapidtag = { path = "external/rapidtag", editable = true }

[tool.uv]
# The tracker only runs on Linux (rcam / the Q6A cameras). Locking for Linux
# alone also lets bless 0.3 resolve: it pins a Windows-only winrt 2.0.0b1 that
# is not on PyPI.
environments = ["sys_platform == 'linux'"]

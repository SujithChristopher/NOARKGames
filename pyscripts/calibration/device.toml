# The device the tracker follows: which tags are on it, and where the tracked
# point sits on it.
#
# Hand-authored and shared with the repo, so a rig is described in one place
# rather than in each person's command line. The *measured* geometry — where
# every tag sits relative to the reference — is not here: that is produced by
# rigidbody_calib.py and written to rigidbody.toml.

[device]
name = "NOARK hand rig"

# Tag ids on the bracket. Anything else the detector reports during a
# calibration take is discarded, so a tag from another rig in the room, or the
# occasional false positive, never reaches the solve.
tag_ids = [1, 2, 3, 4, 5, 6, 7, 8]

tag_size_m = 0.05

# The frame the solved geometry is expressed in. Any tag on the body works —
# tags that never share a view with it are chained back through their
# neighbours — so this is a labelling choice, not an accuracy one.
reference_id = 1

[tip]
# The point the tracker reports: where the patient's hand holds the device.
#
# Measured against tag `tag`, in metres, in that tag's own frame:
#   X  right, along the tag's top edge
#   Y  up, along the tag's left edge
#   Z  out of the printed face  (so the tip is normally NEGATIVE)
#
# Keeping the tag explicit means the measurement stays valid if the body is
# ever re-solved against a different reference_id.
#
# All zeros means "the centre of `tag`" — a real, usable point, and what the
# tracker reports until the hand position has actually been measured. Replace
# it with the measurement and re-run:
#     uv run pyscripts/rigidbody_calib.py --set-tip X Y Z
tag = 1
offset_m = [0.00, 0.01, -0.069]

[cameras]
# Which section of sterio_calibration.toml describes each camera, in the order
# rcam enumerates them. The stereo calibration tool labels its own cam0/cam1,
# and that need not match the order the cameras come up in here — on this rig
# it does not.
#
# Getting it wrong is not a small error: a mismatched extrinsic put 370 mm of
# jitter on a static device, against 2.4 mm for a single camera. Verify with
#     uv run pyscripts/rigidbody_calib.py --check-cameras
# which solves the same tag in both views and reports which mapping agrees.
stream0 = "cam1"
stream1 = "cam0"

# Exposure and gain for both cameras.
#
# exposure_us should be a whole number of the mains half-period, or every frame
# integrates a different slice of the light's sine and the image pulses in
# brightness: 10000 us at 50 Hz, 8333 us at 60 Hz, or multiples. Measured on
# this board under 50 Hz light, 5000 us gave 44% peak-to-peak frame brightness
# and 10000 us gave 0.3%.
#
# Reach for exposure before gain: gain amplifies sensor noise, and the corner
# positions every later stage is built on are exactly what noise spoils. But
# exposure costs motion blur on a moving device, and it cannot exceed the frame
# period (16.6 ms at the free-running rate), so a dark room may need both.
#
# The calibration prints the image level it is actually getting, with a verdict.
exposure_us = 10000
gain = 1.0

# Raspberry Pi-style image processing, ported in rcam.isp: black level, digital
# gain and the ov9281_mono gamma curve, folded into the Y10P unpack.
#
#   "pisp"  the Pi 5 curve      "vc4"  the Pi 4 curve      ""  raw sensor bytes
#
# Measured on this rig, against raw at the same exposure:
#   image level   58 -> 113 /255   (the curve lifts the midtones)
#   frame rate    30 -> 19.5 fps   (~16 ms per pair, visible once the loop is
#                                   doing real work rather than waiting on the
#                                   sensor)
#   jitter        no difference that repeated runs could separate
#   depth         a consistent +0.8 mm offset
#
# That last line is why this must not be changed casually: the rigid body has
# to be calibrated in the same mode it is tracked in, or the geometry and the
# tracking disagree by that offset.
isp = "pisp"
